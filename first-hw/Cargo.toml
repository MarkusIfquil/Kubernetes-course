[package]
name = "hello"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
async-trait = "0.1"
axum = "0.8"
hostname = "0.4"
redis = { version = "0.32", default-features = false, features = ["tokio-comp"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
